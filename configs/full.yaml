seed: 42
random_split: {train: 0.64, val: 0.16, test: 0.20}
train_subset_n: null
n_jobs: 4
val_threshold_rule: f1
bootstrap_n: 500
feature_sets: [FULL_NUMERIC, NO_SUSPECT_DERIVED, URL_LEXICAL_STRICT, STRICT_NO_COLLECTION_CUES]
models:
  dummy: {enabled: true}
  logreg: {enabled: true, C: [0.1, 1.0, 10.0], max_iter: 2000}
  rf: {enabled: true, n_estimators: 200, max_depth: [null, 16], min_samples_leaf: [1, 3]}
  linsvc: {enabled: true, C: [0.1, 1.0, 10.0], max_iter: 5000}
  tree_stump: {enabled: true, max_depth: [1, 3]}
pca:
  variance_targets: [0.90, 0.95, 0.99]
  fixed_components: [5, 10, 20]
clustering:
  max_sample: 25000
  k_range: [2, 3, 4, 5, 6]
  silhouette_sample: 5000
split_sensitivity:
  ratios: [[0.7, 0.3], [0.8, 0.2], [0.9, 0.1]]
  seeds: [42, 43, 44]
decision:
  academic_accuracy_target: 0.95
  academic_f1_target: 0.95
  robust_group_accuracy_target: 0.90
  robust_group_f1_target: 0.90
  max_random_group_gap_pp: 5.0
  label_proxy_warning: 0.99
  severe_path_bias_legit_max: 0.01
  severe_path_bias_phish_min: 0.10
